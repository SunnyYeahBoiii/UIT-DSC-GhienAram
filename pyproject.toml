[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-legalqa-3p88b"
version = "10.0.0.dev0"
description = "Offline Vietnamese LegalQA pipeline for UIT Data Science Challenge 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1,<2",
  "scikit-learn>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
