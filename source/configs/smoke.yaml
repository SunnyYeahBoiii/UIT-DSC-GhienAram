seed: 20260806

paths:
  warmup: "F:/warmup.json"
  corpus: null
  artifacts: "artifacts/smoke"
  models:
    generator: null
    embedding: null
    reranker: null
    bartpho: null
    verifier: null

runtime:
  offline: true
  local_files_only: true
  trust_remote_code: false
  device: "cpu"
  dtype: "float32"
  batch_size: 2
  unload_after_stage: true

corpus:
  id_fields: ["document_id", "doc_id", "id", "law_id"]
  title_fields: ["title", "name", "document_name"]
  text_fields: ["passage", "text", "content", "body", "document"]
  max_chunk_chars: 4200
  overlap_chars: 400
  min_chunk_chars: 80
  skip_empty: true

retrieval:
  bm25_top_k: 30
  dense_top_k: 0
  fused_top_k: 15
  rerank_top_k: 0
  evidence_top_k: 4
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 0.0
  reranker_weight: 0.0
  citation_boost: 0.12

generation:
  qwen_enabled: false
  bartpho_enabled: false
  extractive_enabled: true
  max_context_chars: 14000
  max_new_tokens: 500
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  repetition_penalty: 1.0
  min_answer_words: 50
  target_answer_words: 220
  max_answer_words: 450

selection:
  evidence_support: 0.40
  query_coverage: 0.15
  legal_citations: 0.20
  numeric_faithfulness: 0.15
  legal_semantic: 0.0
  length_prior: 0.10
  unsupported_penalty: 0.30
  duplicate_penalty: 0.08

split:
  dev_ratio: 0.20
