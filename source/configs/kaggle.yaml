seed: 20260806

paths:
  # run_end_to_end.py auto-discovers and overwrites these paths under /kaggle/input.
  warmup: null
  corpus: null
  artifacts: "/kaggle/working/legalqa_artifacts"
  models:
    generator: null
    embedding: null
    reranker: null
    bartpho: null
    verifier: null
    generator_adapter: null

runtime:
  offline: true
  local_files_only: true
  trust_remote_code: true
  device: "auto"
  dtype: "float16"
  batch_size: 8
  reranker_max_length: 768
  unload_after_stage: true

corpus:
  id_fields: ["id", "document_id", "doc_id", "law_id"]
  title_fields: ["name", "title", "document_name"]
  text_fields: ["passage", "text", "content", "body", "document"]
  max_chunk_chars: 4200
  overlap_chars: 350
  min_chunk_chars: 120
  skip_empty: true

retrieval:
  bm25_top_k: 90
  agentic_bm25_top_k: 60
  agentic_return_top_k: 12
  agentic_graph_documents: 3
  agentic_graph_chunks_per_document: 1
  agentic_bm25_weight: 0.46
  agentic_overlap_weight: 0.34
  agentic_exact_document_boost: 0.45
  agentic_exact_article_boost: 0.30
  agentic_relation_boost: 0.18
  agentic_reference_document_boost: 0.16
  agentic_obsolete_penalty: 0.45
  agentic_min_relevance: 0.16
  agentic_min_score_ratio: 0.35
  dense_top_k: 60
  fused_top_k: 30
  rerank_top_k: 16
  evidence_top_k: 5
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 1.10
  reranker_weight: 0.72
  citation_boost: 0.12

generation:
  qwen_enabled: true
  bartpho_enabled: false
  extractive_enabled: true
  # Vòng lặp tool-call: model có thể tự phát truy vấn "TRA_CUU: ..." để BM25
  # (SQLite FTS5) tra thêm căn cứ giữa các lượt sinh. Mặc định tắt để không
  # đổi hành vi baseline; bật thử bằng true (tốn thêm tối đa
  # agentic_max_tool_calls lượt sinh/câu hỏi).
  agentic_enabled: false
  agentic_routes: ["complex"]
  agentic_confidence_below: 0.45
  agentic_on_legal_cues: true
  agentic_max_tool_calls: 2
  agentic_evidence_per_call: 3
  agentic_max_query_chars: 240
  agentic_warn_after_nonfatal_errors: 3
  max_context_chars: 18000
  max_new_tokens: 850
  bartpho_num_beams: 1
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.03
  min_answer_words: 70
  target_answer_words: 330
  max_answer_words: 700

selection:
  evidence_support: 0.34
  query_coverage: 0.14
  legal_citations: 0.18
  numeric_faithfulness: 0.15
  legal_semantic: 0.12
  length_prior: 0.07
  unsupported_penalty: 0.28
  duplicate_penalty: 0.08
  source_priors:
    qwen3.5-2b: 0.08
    qwen3.5-2b-agentic: 0.08
    extractive: -0.03
    train-memory: 0.00

split:
  dev_ratio: 0.02
