[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-legalqa-3p88b"
version = "0.9.1"
description = "Offline Vietnamese LegalQA pipeline for UIT Data Science Challenge 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers==5.14.1",
  "huggingface-hub==1.26.1",
  "hf-xet==1.6.0",
  "click==8.4.2",
  "tokenizers==0.22.2",
  "regex==2026.7.19",
  "numpy>=1.26,<3",
  "PyYAML>=6.0.1,<7",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "Pillow>=9.5,<13",
  "accelerate==1.14.0",
  "safetensors==0.8.0",
  "sentence-transformers==5.7.0",
  "peft==0.18.1",
  "bitsandbytes==0.49.2",
  "sentencepiece==0.2.1",
  "scipy>=1,<2",
  "scikit-learn>=1,<2",
]

[project.optional-dependencies]
train = []
dev = ["pytest>=8.3"]

[project.scripts]
legalqa = "legalqa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
