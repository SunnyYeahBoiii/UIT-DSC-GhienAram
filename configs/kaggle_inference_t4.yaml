seed: 20260806

paths:
  warmup: null
  corpus: null
  artifacts: "/kaggle/working/legalqa_inference"
  models:
    generator: null
    embedding: null
    reranker: null
    bartpho: null
    verifier: null
    generator_adapter: null

runtime:
  offline: true
  local_files_only: true
  trust_remote_code: true
  device: "cuda:0"
  dtype: "float16"
  batch_size: 1
  embedding_batch_size: 2
  reranker_batch_size: 1
  verifier_batch_size: 4
  reranker_max_length: 512
  unload_after_stage: true
  dense_index_dir: "/kaggle/working/legalqa_dense_index"
  train_memory_dir: "/kaggle/working/legalqa_dense_index/train_memory"

corpus:
  id_fields: ["id", "document_id", "doc_id", "law_id"]
  title_fields: ["name", "title", "document_name"]
  text_fields: ["passage", "text", "content", "body", "document"]
  max_chunk_chars: 1500
  overlap_chars: 100
  min_chunk_chars: 400
  skip_empty: true

retrieval:
  global_dense_enabled: true
  bm25_top_k: 140
  # Pool FTS5 thô cho mỗi lượt tool-call: rộng hơn số đoạn thực sự dùng để
  # bước chọn đa dạng văn bản (agentic_max_per_document) có đủ hậu bị sau
  # lọc trùng chunk đã thấy; legal reranking bên dưới chỉ trả top
  # agentic_return_top_k.
  agentic_bm25_top_k: 80
  agentic_return_top_k: 12
  agentic_graph_documents: 3
  agentic_graph_chunks_per_document: 1
  agentic_bm25_weight: 0.46
  agentic_overlap_weight: 0.34
  agentic_exact_document_boost: 0.45
  agentic_exact_article_boost: 0.30
  agentic_relation_boost: 0.18
  agentic_reference_document_boost: 0.16
  agentic_obsolete_penalty: 0.45
  agentic_min_relevance: 0.16
  agentic_min_score_ratio: 0.35
  dense_top_k: 70
  fused_top_k: 48
  rerank_top_k: 24
  evidence_top_k: 5
  simple_evidence_top_k: 4
  # Sàn tương đối (× top score) cho evidence route simple — khớp complex_min_score_ratio.
  # Không có sàn, slot bị lấp bằng chunk ~0.02 điểm chỉ để đủ top_k (audit v7: 11/41 slot rác).
  simple_min_score_ratio: 0.42
  complex_evidence_top_k: 6
  complex_max_documents: 4
  complex_diversity_bonus: 0.04
  complex_min_score_ratio: 0.42
  trace_fused_top_k: 48
  trace_rerank_top_k: 24
  trace_lexical_top_k: 40
  trace_dense_top_k: 40
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 1.10
  reranker_weight: 0.72
  exact_document_boost: 0.34
  exact_article_boost: 0.20
  generic_number_boost: 0.01
  graph_base_score: 0.03
  graph_relation_weight: 0.16
  graph_min_reranker: 0.12
  graph_relative_reranker: 0.30
  graph_temporal_threshold_discount: 0.60
  graph_min_lexical_without_reranker: 2.0
  obsolete_document_penalty: 0.36
  train_memory_enabled: true
  train_memory_top_k: 4
  train_memory_build_block: 128
  train_memory_checkpoint_every: 512
  train_memory_fewshot_examples: 2
  # Submission try1 có fewshot_examples=0 trên mọi item => top-4 similarity
  # chưa bao giờ chạm 0.70. Hạ ngưỡng để few-shot văn phong thực sự vào prompt;
  # nếu vẫn còn nhiều item =0, hạ tiếp theo phân bố similarity đo được.
  train_memory_fewshot_threshold: 0.55
  train_memory_fewshot_chars: 3200
  train_memory_candidate_enabled: true
  train_memory_candidate_threshold: 0.86
  dense_build_block: 256
  dense_checkpoint_every: 4096
  dense_search_block: 8192

routing:
  simple_confidence_threshold: 0.68
  simple_min_reranker: 0.68
  complex_below_confidence: 0.30
  complex_max_margin: 0.02
  complex_max_document_concentration: 0.40
  max_iterations: 2
  max_new_docs_per_iteration: 3
  graph_chunks_per_document: 2

generation:
  qwen_enabled: true
  bartpho_enabled: false
  extractive_enabled: true
  # Vòng lặp tool-call: model có thể tự phát truy vấn "TRA_CUU: ..." để BM25
  # (SQLite FTS5) tra thêm căn cứ giữa các lượt sinh. Gate chỉ chạy cho câu
  # Complex, retrieval yếu hoặc có tín hiệu pháp lý cần mở rộng — chi phí
  # thêm chỉ phát sinh trên phần câu hỏi thật sự cần thêm bằng chứng.
  agentic_enabled: true
  agentic_routes: ["complex"]
  agentic_confidence_below: 0.45
  agentic_on_legal_cues: true
  # 3 lượt tra cứu: lượt 1 thường tra chủ đề chính, lượt 2/3 mới tra số hiệu
  # văn bản hoặc điều khoản dẫn chiếu — 2 lượt cũ hay bỏ dở chuỗi này. Chi
  # phí chỉ phát sinh khi model thật sự gọi tiếp (vòng lặp dừng ngay khi
  # model trả lời).
  agentic_max_tool_calls: 3
  agentic_evidence_per_call: 4
  # BM25 top thường trả nhiều window liền kề của cùng văn bản; cap 2 chunk/
  # văn bản giữ đa dạng cho câu complex (window liền kề đã được gộp text).
  agentic_max_per_document: 2
  agentic_max_query_chars: 240
  agentic_warn_after_nonfatal_errors: 3
  # Tỉ lệ max_context_chars dành riêng cho căn cứ tool-call tìm thêm; phần
  # còn lại bảo đảm căn cứ retrieval ban đầu không bị đẩy hết ra khỏi prompt
  # ở các lượt sau khi pool tool-call cộng dồn.
  agentic_tool_context_share: 0.45
  # Đủ chỗ cho ~6 căn cứ ban đầu (có thể đã gộp window, mỗi đoạn tới ~8k ký
  # tự) + ~4 đoạn tool-call; prompt vẫn xa giới hạn context của Qwen 2B.
  max_context_chars: 24000
  # p90 độ dài thật của train.json (đo bằng build_answer_style_profile) lên
  # tới ~576-619 từ tuỳ question_type; cap 512 cũ cắt cụt phần lớn câu trả
  # lời dài trước khi chạm target đã học. Nâng cap để không tự chặn dưới p90.
  max_new_tokens: 1300
  simple_max_new_tokens: 1050
  complex_max_new_tokens: 1300
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  # Audit submission try1: loop vẫn xảy ra dù ngram=5 vì model lặp bằng cách
  # biến đổi từ ("gặp xe đi nhanh/chậm/dừng" chỉ chia sẻ 3-gram). Hạ xuống 4.
  no_repeat_ngram_size: 4
  # Model dừng sớm ~0.55x target (median 191 từ vs reference p50 312) làm rớt
  # recall METEOR/ROUGE-L; ép sàn token = target*ratio qua min_new_tokens.
  min_new_tokens_target_ratio: 0.75
  min_answer_words: 35
  target_answer_words: 180
  simple_target_answer_words: 140
  complex_target_answer_words: 260
  max_answer_words: 760
  style_min_group_size: 20
  style_floor_words: 35
  style_ceiling_words: 760
  tokens_per_vietnamese_word: 1.65
  compact_generated_answers: true
  hard_trim_generated_answers: false

selection:
  evidence_support: 0.18
  query_coverage: 0.16
  legal_citations: 0.12
  numeric_faithfulness: 0.12
  legal_semantic: 0.03
  length_prior: 0.04
  fluency: 0.22
  unsupported_penalty: 0.25
  duplicate_penalty: 0.08
  fragment_penalty: 0.16
  truncation_penalty: 0.22
  retrieval_risk_penalty: 0.10
  qwen_preference_margin: 0.06
  source_priors:
    qwen3.5-2b: 0.08
    # Agentic được verifier chấm trên tập căn cứ mở rộng (initial + tool-call)
    # nên citation/numeric precision của nó đáng tin hơn chút khi bảng điểm
    # sát nhau; ưu tiên nhẹ thay vì để hoà với qwen thường.
    qwen3.5-2b-agentic: 0.10
    extractive: -0.03
    train-memory: 0.00

split:
  dev_ratio: 0.02
